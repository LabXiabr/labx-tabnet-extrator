name: PoC DBC - catalogo e lote
on:
  workflow_dispatch:
    inputs:
      fonte:
        description: 'Sistema / Subsistema (selecione uma fonte mapeada)'
        required: true
        type: choice
        default: SIA/PA
        options:
        # INICIO-FONTES-GERADAS
          - CIH/CR
          - CIHA/CI
          - CNES/DC
          - CNES/EE
          - CNES/EF
          - CNES/EP
          - CNES/EQ
          - CNES/GM
          - CNES/HB
          - CNES/IN
          - CNES/LT
          - CNES/PF
          - CNES/RC
          - CNES/SR
          - CNES/ST
          - SIA/AB
          - SIA/ABO
          - SIA/ACF
          - SIA/AD
          - SIA/AM
          - SIA/AN
          - SIA/AQ
          - SIA/AR
          - SIA/ATD
          - SIA/BI
          - SIA/PA
          - SIA/PS
          - SIA/SAD
          - SIH/ER
          - SIH/RD
          - SIH/RJ
          - SIH/SP
          - SINASC/DN
          - SINASC/DNR
          - SISPRENATAL/PN
        # FIM-FONTES-GERADAS
      competencia:
        description: 'Ano completo: 2010 | Um mes: 2010-04'
        required: true
        type: string
        default: '2010'
permissions:
  contents: read
concurrency:
  group: poc-dbc-lote-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Conferir catalogo e formulario
        run: |
          python scripts/gerar_opcoes_workflow.py --check
          python -m unittest discover -s tests -p test_lote_dbc.py -v
      - name: Consultar arquivos do DATASUS (somente descoberta)
        env:
          FONTE: ${{ inputs.fonte }}
          COMPETENCIA: ${{ inputs.competencia }}
        run: |
          set -euo pipefail
          python scripts/lote_dbc.py --fonte "$FONTE" --competencia "$COMPETENCIA"
      - name: Salvar plano de descoberta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plano-datasus-${{ github.run_id }}
          path: poc_dbc_online/saidas/plano_lote.json
          if-no-files-found: warn
          retention-days: 7
