name: DATASUS - baixar arquivos DBC
on:
  workflow_dispatch:
    inputs:
      fonte:
        description: 'Sistema / Subsistema'
        type: choice
        required: true
        default: SIA/PA
        options:
        # INICIO-FONTES-GERADAS
          - SIA/AM
          - SIA/PA
          - SIH/RD
        # FIM-FONTES-GERADAS
      competencia:
        description: 'Ano inteiro (2010) ou mês (2010-04)'
        type: string
        required: true
        default: '2010-04'
permissions:
  contents: read
concurrency:
  group: labx-dbc-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preparar:
    name: Validar fonte e preparar lotes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matriz: ${{ steps.matriz.outputs.matriz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar opções e gerar matriz
        id: matriz
        env:
          FONTE: ${{ inputs.fonte }}
          COMPETENCIA: ${{ inputs.competencia }}
        run: |
          set -euo pipefail
          python scripts/gerar_opcoes_workflow.py --check
          python scripts/baixar_dbc_actions.py --fonte "$FONTE" --competencia "$COMPETENCIA" --matriz > /tmp/matriz.json
          echo "matriz=$(cat /tmp/matriz.json)" >> "$GITHUB_OUTPUT"
          python -c 'import json; print("Lotes:", len(json.load(open("/tmp/matriz.json"))["include"]))'
  baixar:
    name: ${{ matrix.competencia }} / ${{ matrix.ufs }}
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.preparar.outputs.matriz) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Baixar DBCs do DATASUS e calcular hash SHA-256
        env:
          FONTE: ${{ inputs.fonte }}
          COMPETENCIA: ${{ matrix.competencia }}
          UFS: ${{ matrix.ufs }}
        run: |
          set -euo pipefail
          python scripts/baixar_dbc_actions.py --fonte "$FONTE" --competencia "$COMPETENCIA" --ufs "$UFS"
      - name: Disponibilizar DBCs originais e manifestos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbc-${{ matrix.competencia }}-${{ matrix.ufs }}-${{ github.run_id }}
          path: |
            poc_dbc_online/saidas/dbc/**/*.dbc
            poc_dbc_online/saidas/dbc/**/manifesto.json
            poc_dbc_online/saidas/dbc/**/resumo_lote.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
