name: Extracao por intervalo DATASUS

on:
  workflow_dispatch:
    inputs:
      inicio:
        description: "Competencia inicial (AAAA-MM)"
        required: true
        default: "2009-04"
        type: string
      fim:
        description: "Competencia final (AAAA-MM)"
        required: true
        default: "2009-06"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: extracao-real-datasus
  cancel-in-progress: false

jobs:
  intervalo:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      INICIO: ${{ inputs.inicio }}
      FIM: ${{ inputs.fim }}

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Calcular competencias automaticamente
        shell: bash
        run: |
          python - <<'CHECK'
          import os
          import re

          inicio = os.environ["INICIO"]
          fim = os.environ["FIM"]

          padrao = r"2009-(0[1-9]|1[0-2])"

          if not re.fullmatch(padrao, inicio):
              raise SystemExit("Inicio invalido.")

          if not re.fullmatch(padrao, fim):
              raise SystemExit("Fim invalido.")

          if inicio > fim:
              raise SystemExit("Intervalo invertido.")

          quantidade = int(fim[-2:]) - int(inicio[-2:]) + 1

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8",
          ) as saida:
              saida.write("LIMITE=" + str(quantidade) + chr(10))

          print(f"Competencias calculadas: {quantidade}")
          CHECK

      - name: Validar intervalo
        id: validar
        run: |
          python scripts/intervalo_github.py \
            validar "$INICIO" "$FIM" "$LIMITE"

      - name: Localizar resultados anteriores
        id: localizar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/localizar_artefato.py             "$INICIO" "$FIM"

      - name: Baixar resultados anteriores
        if: ${{ steps.localizar.outputs.encontrado == 'true' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.localizar.outputs.run_id }}
          pattern: resultado-sia-am-*
          merge-multiple: true
          path: recuperado
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restaurar competencias aprovadas
        if: ${{ steps.localizar.outputs.encontrado == 'true' }}
        run: |
          python scripts/restaurar_execucoes.py             "$INICIO" "$FIM"

      - name: Inicializar formulario DATASUS
        id: inicializar
        shell: bash
        run: |
          set -euo pipefail

          for tentativa in 1 2; do
            if python src/inicializar.py; then
              echo "Formulario obtido do DATASUS."
              exit 0
            fi

            echo "Tentativa $tentativa falhou."
            if [ "$tentativa" -eq 1 ]; then
              sleep 5
            fi
          done

          echo "::warning::DATASUS indisponivel. Usando snapshot de 2009."

          mkdir -p dados/inspecao

          cp -n \
            configuracoes/snapshots/sia_am_arquivos_2009.json \
            dados/inspecao/formulario_sia_qabr.json

          python - <<'CHECK'
          import json
          from pathlib import Path

          arquivo = Path(
              "dados/inspecao/formulario_sia_qabr.json"
          )
          dados = json.loads(arquivo.read_text(encoding="utf-8"))

          campos = [
              c for c in dados["campos"]
              if c.get("name") == "Arquivos"
          ]
          if len(campos) != 1:
              raise SystemExit("Snapshot invalido.")

          valores = {
              o["value"].lower()
              for o in campos[0]["opcoes"]
          }

          esperados = {
              f"qabr09{mes:02d}.dbf"
              for mes in range(1, 13)
          }

          if not esperados.issubset(valores):
              raise SystemExit("Competencias ausentes no snapshot.")

          print("Snapshot verificado com sucesso.")
          CHECK


      - name: Planejar intervalo
        run: |
          python src/executar_intervalo.py \
            --sistema SIA \
            --subsistema AM \
            --inicio "$INICIO" \
            --fim "$FIM" \
            --modo dinamico

      - name: Extrair validar e consolidar
        shell: bash
        run: |
          set -euo pipefail

          python src/executar_intervalo.py \
            --sistema SIA \
            --subsistema AM \
            --inicio "$INICIO" \
            --fim "$FIM" \
            --modo dinamico \
            --executar \
            --consolidar \
            --limite "$LIMITE" < <(yes s)

      - name: Resumir e preparar artefatos
        id: organizar
        if: ${{ always() && steps.validar.outcome == 'success' && steps.inicializar.outcome == 'success' }}
        run: |
          python scripts/intervalo_github.py \
            empacotar "$INICIO" "$FIM" "$LIMITE"

      - name: Disponibilizar resultados aprovados
        if: ${{ always() && steps.organizar.outputs.has_files == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: resultado-sia-am-${{ inputs.inicio }}-a-${{ inputs.fim }}-${{ github.run_number }}
          path: pacote/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
